# Dependabot. Revisa cada lunes y abre como máximo 3 PR por ecosistema.
# Cuando exista Cargo.toml o package.json se agrega su ecosistema aquí.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Tegucigalpa
    open-pull-requests-limit: 3
    groups:
      acciones:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
