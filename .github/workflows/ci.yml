name: ci

# - cambios: tamaño del PR y búsqueda de secretos con gitleaks. Corre siempre.
# - auditoria: pruebas del registro de auditoría y verificación de su cadena.
# - CI completo: el único check obligatorio. Falla si un job falló o se canceló.
# Las acciones van fijadas por SHA, con la versión en un comentario; Dependabot las actualiza.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: Cambios y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rango a revisar
        id: rutas
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          CABEZA_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          case "$EVENTO" in
            pull_request) base="$BASE_PR"; cabeza="$CABEZA_PR" ;;
            push) base="$ANTES"; cabeza="$GITHUB_SHA" ;;
            *) base=""; cabeza="$GITHUB_SHA" ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "rango=$base..$cabeza" >> "$GITHUB_OUTPUT"
          else
            echo "rango=" >> "$GITHUB_OUTPUT"
          fi

      - name: Tamaño del PR
        if: github.event_name == 'pull_request'
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          CABEZA_PR: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$BASE_PR" "$CABEZA_PR")
          lineas=$(git diff --numstat "$base" "$CABEZA_PR" -- . ':(exclude)contexto/**' ':(exclude)*.md' ':(exclude)*.lock' ':(exclude)**/package-lock.json' ':(exclude)audit/*.jsonl' |
            awk '$1 != "-" { s += $1 + $2 } END { print s + 0 }')
          echo "Líneas de código del PR: $lineas (recomendado: unas 500; tope: 1000)"
          if [ "$lineas" -gt 1000 ]; then
            echo "::error::El PR tiene $lineas líneas de código; el tope es 1000. Pártelo en PR más chicos."
            exit 1
          fi
          if [ "$lineas" -gt 500 ]; then
            echo "::warning::El PR tiene $lineas líneas de código; lo recomendado son unas 500."
          fi

      - name: Secretos (gitleaks)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          RANGO: ${{ steps.rutas.outputs.rango }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          opciones=()
          if [ -n "$RANGO" ]; then opciones+=("--log-opts=$RANGO"); fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --no-banner --redact --verbose "${opciones[@]}" .

  auditoria:
    name: Registro de auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Pruebas
        run: python3 -I -m unittest discover -s audit -p 'test_*.py' -v
      - name: Cadena del registro
        run: node audit/verificar.mjs

  ci-completo:
    name: CI completo
    if: always()
    needs: [cambios, auditoria]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resultado de los jobs
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          case " $RESULTADOS " in
            *" failure "* | *" cancelled "*)
              echo "::error::Un job falló o se canceló."
              exit 1
              ;;
          esac
